[package]
name = "astrid-core"
description = "Shared Astrid client core: models, services, offline write journal, and the cross-platform contracts mirrored from astrid-web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Which SQLite a client links. `bundled` compiles it in, which Windows and Android require —
# neither has a `libsqlite3` an MSVC or NDK link can find — so it is ON by default and every
# consumer that says nothing keeps today's behaviour. Apple turns it off
# (`default-features = false`) to link the system SQLite it already carries. Asserted by
# `tests/build_features.rs`, which is the only layer of the gate that can see build configuration
# (task `f1210dd8`).
[features]
default = ["bundled-sqlite", "sync-google"]
bundled-sqlite = ["rusqlite/bundled"]
# Google Tasks mirroring — the only provider with a client-side pass, and so the only one there is
# anything to compile out of a partner build. GitHub sync is a cron on astrid-web, which is why
# `services/external/github.rs` is 27 lines of names and `services/external/google/` is 3,805.
# ON by default: every client that says nothing goes on mirroring. Turning it off keeps the
# commands in the vocabulary — `Command::kinds()` has one shape under every feature combination, or
# three repositories' bindings gates would each need a matrix — and refuses them with
# SYNC_GOOGLE_UNAVAILABLE, the way `require-base-url` refuses a start (task `b92569a8`).
sync-google = []
# White-label builds: compiles out the last Astrid address, the origin a relative Markdown link
# resolves against when its caller names none (astrid-rules, AWTD-1630). `baseUrl` itself is
# required in every build since AWTD-1627 (CONFIG_BASE_URL_REQUIRED), so the feature no longer
# touches it; it is kept so a shell that already turned it on goes on building.
require-base-url = ["astrid-rules/require-base-url"]
# The wire schema: `Command`, and the row and detail types a response carries. OFF by default — a
# shipped client never asks for it. `cargo xtask gen-schema` turns it on to write
# `generated/schema/`, and a consumer's bindings gate turns it on as a DEV dependency, which under
# resolver 2 keeps `schemars` out of the library it ships.
schema = ["dep:schemars", "astrid-rules/schema"]

[dependencies]
astrid-rules = { path = "../astrid-rules", version = "0.1.0" }
schemars = { workspace = true, optional = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
strum = { workspace = true }

# The HTTP stack. Everywhere but Android it speaks the platform's own TLS (see the workspace
# manifest). Android has no system OpenSSL for an NDK build to link — native-tls there means
# OpenSSL, which would also have to be taught Android's certificate store — so on Android it is
# rustls with the Mozilla root bundle. That matches what an Android app trusts by default since
# API 24: the system's CAs, never user-installed ones (AATD-4).
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "gzip", "stream", "charset", "http2"] }

[dev-dependencies]
# `hooks` lets a test count commits: the sync merge is one transaction per phase, not one per row
# (AITD-454), and only a commit hook can see the difference.
rusqlite = { workspace = true, features = ["hooks"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
