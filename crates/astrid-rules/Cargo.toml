[package]
name = "astrid-rules"
description = "Astrid's pure, fixture-locked rules: models, repeating rollover, permissions, parsing, markdown, rows — no I/O, so it builds for every target astrid-core does and for wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Nothing here may read a clock, a disk, a socket or the OS's entropy: whatever a rule depends on
# arrives as an argument. That is what lets the web run these rules as WebAssembly, and it is
# checked in CI by building this crate for wasm32-unknown-unknown. So no rusqlite, reqwest, tokio,
# getrandom, uuid or iana-time-zone — and jiff without `tz-system`, `js` or a clock.
[features]
default = [
    "markdown",
    "orchestration",
    "tradeoff",
    "rules-repeating",
    "rules-waiting",
    "rules-decisions",
    "rules-shell",
]
# Rule groups for the door (AWTD2-162 step 2, docs/BROWSER_DOOR.md). Each gates the `Rule` variants
# named, and their arms in `rules::run`, so a build without one refuses the kind by name
# (`unknown variant`) instead of carrying code nothing in that build calls. ALL ON by default, so
# every native client and astrid-web's Node package answer exactly what they always did, and
# `generated/schema/rule.json` does not move. Only `astrid-rules-wasm`'s browser build turns them
# off, and `kinds()` says which of them a build kept.
#
# `completion`, `nextOccurrence`: the only rules that parse an IANA zone name, so they are what
# keeps jiff's bundled zone table in the binary (`tzdb-bundle-always`: wasm and Windows have no
# zoneinfo directory to read, and a build must answer the same on every host).
rules-repeating = ["jiff/tzdb-bundle-always"]
# `waitingWrite`, `waitingWake`, `waitingSettle`, `waitingHandoff`, `handBack`, `resultsWrite`, `resultsSettle` (ADEV-274), and the recorded
# questions `questionAsk`, `questionAnswer`, `questionsWaitingOn`, `questionMarker` (AWTD-1687):
# server-side writes.
rules-waiting = []
# `decision`, `decisionReply`, `decisionChoice`, `tradeoffGrid`, `ratingKey`: read by the comment views that draw a Decision card.
rules-decisions = []
# The native shells' presentation rules: `repeatSummary`, `customAgentName`, `brandColors`,
# `listProjectMoves`, `sidebar`, `listDefaultPicks`, `nesting`, `mentionTrigger`, `mentionInsert`,
# `copyOnly`, `commentVisibility`, `capabilities`, `paletteRank`, `shortcut`, `quickAddDefaults`,
# `reminderTriage`, `pluralCategory`, `calloutPlacement`, `detailLayout`, `leadingPicker`,
# `listChips`, `dayOffset`. Web has its own component for each.
rules-shell = []
# The markdown renderer, and everything that can only be answered by running it: `renderMarkdown`,
# the chat transcript, and a comment row's `blocks`. ON by default — every shell draws comments —
# and turned OFF by `astrid-rules-wasm`, because the browser has its own renderer and `renderMarkdown`
# exists for the clients that do not (task 4d05306d).
#
# What stays when it is off is deliberate: `rows::comment`'s `shows_text`, `is_empty`, `files_of`
# and `renders_inline` are what `Rule::CommentVisibility` asks, and none of them parse anything.
# Taking the predicates out with the renderer would be a silent capability loss for the browser.
markdown = ["dep:pulldown-cmark"]
# The orchestration policy (AWTD-1685): who takes a task, what an agent may do on its own, who it
# asks — `orchestration` and the rules door's `orchestrationPolicy`, `orchestrationRoute`,
# `orchestrationMay` and `orchestrationEscalate`. ON by default, and for astrid-web's Node package
# (`astrid-rules-wasm/orchestration`), because the server enforces it wherever an agent acts. OFF in
# the browser build: no page decides what an agent may do, and the browser's size is a budget
# (README, docs/BROWSER_DOOR.md).
orchestration = []
# The trade-off policy (ADEV-273): what label an estimate earns and how two ideas order — the
# `tradeoffEvaluate` rule. Its types ride in `orchestration` (a policy's `tradeoff` key), so this
# needs it. ON by default and for astrid-web's Node package, where the server evaluates; OFF in the
# browser build, which refuses it by name. The `policy` sort arm of `filters::sort_by_setting` is a
# comparison and is in every build.
tradeoff = ["orchestration"]
# No Astrid server in the binary: a `renderMarkdown` request that names no `origin` leaves a
# relative link relative instead of resolving it on astrid.cc (AWTD-1630). Turned on by
# astrid-core's feature of the same name (astrid-web AWTD-1627).
require-base-url = []
# Derive a JSON Schema for the types that cross the boundary. OFF by default and compiled only by
# `cargo xtask gen-schema` and the consumers' bindings gates: `astrid-rules-wasm` is built from this
# crate and its byte count is a product requirement, so a derive nothing at runtime reads must not
# be in the default build.
schema = ["dep:schemars"]

[dependencies]
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
# `rules::kinds()`: the compiler writes the list of compiled variants (a derive, nothing at runtime).
strum = { workspace = true }
schemars = { workspace = true, optional = true }

# `build.rs` narrows `contracts/fixtures/smart.json` to its `keywords` before they are embedded
# (task 4d05306d). It runs on the host at build time, so this is not a wasm or runtime dependency,
# and it is a crate the lockfile already carries.
[build-dependencies]
serde_json = { workspace = true }

# The tests that name a zone (`America/Los_Angeles`) need the zone table whichever rule groups the
# build under test has. `rules-repeating` is what bundles it for a shipped build; a dev-dependency's
# features reach only test builds (resolver 2), so the browser artifact is unaffected.
[dev-dependencies]
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
