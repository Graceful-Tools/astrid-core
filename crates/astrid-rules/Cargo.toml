[package]
name = "astrid-rules"
description = "Astrid's pure, fixture-locked rules: models, repeating rollover, permissions, parsing, markdown, rows — no I/O, so it builds for every target astrid-core does and for wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Nothing here may read a clock, a disk, a socket or the OS's entropy: whatever a rule depends on
# arrives as an argument. That is what lets the web run these rules as WebAssembly, and it is
# checked in CI by building this crate for wasm32-unknown-unknown. So no rusqlite, reqwest, tokio,
# getrandom, uuid or iana-time-zone — and chrono without `clock`.
[features]
# No Astrid server in the binary: a `renderMarkdown` request that names no `origin` leaves a
# relative link relative instead of resolving it on astrid.cc (AWTD-1630). Turned on by
# astrid-core's feature of the same name (astrid-web AWTD-1627).
require-base-url = []
# Derive a JSON Schema for the types that cross the boundary. OFF by default and compiled only by
# `cargo xtask gen-schema` and the consumers' bindings gates: `astrid-rules-wasm` is built from this
# crate and its byte count is a product requirement, so a derive nothing at runtime reads must not
# be in the default build.
schema = ["dep:schemars"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true }
schemars = { workspace = true, optional = true }

# `build.rs` narrows `contracts/fixtures/smart.json` to its `keywords` before they are embedded
# (task 4d05306d). It runs on the host at build time, so this is not a wasm or runtime dependency,
# and it is a crate the lockfile already carries.
[build-dependencies]
serde_json = { workspace = true }
