[package]
name = "astrid-rules-wasm"
description = "astrid-rules' stateless door (`rules::run_json`) as WebAssembly, for astrid-web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` drops the markdown renderer and the rules that can only be answered
# by running it (task 4d05306d). The browser already renders markdown — `renderMarkdown` is for
# the clients that do not — and `pulldown-cmark` is bytes the browser downloads to never call.
astrid-rules = { path = "../astrid-rules", version = "0.1.0", default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
