[package]
name = "astrid-rules-wasm"
description = "astrid-rules' stateless door (`rules::run_json`) as WebAssembly, for astrid-web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# OFF by default, so `cargo build -p astrid-rules-wasm` is the BROWSER build: no markdown renderer,
# and no rule that can only be answered by running one (task 4d05306d). The browser renders
# markdown itself, and `pulldown-cmark` would be bytes it downloads and never calls.
#
# ON for the Node package (`scripts/build-wasm.sh` builds twice). astrid-web's server calls
# `renderMarkdown` through it: `tests/lib/core-rules-markdown-parity.test.ts` holds web's renderer
# to the core's. Step 1 gated markdown out of this crate as a whole, and because one artifact fed
# both packages, the Node package lost `renderMarkdown` too (AWTD2-162).
markdown = ["astrid-rules/markdown"]
# The orchestration policy (AWTD-1685). OFF for the browser and ON for the Node package, like
# `markdown`: astrid-web's server asks it wherever an agent acts, and no page does, so the browser
# downloads none of it.
orchestration = ["astrid-rules/orchestration"]
# The trade-off policy (ADEV-273): the server evaluates an estimate through it. Off in the browser,
# which refuses `tradeoffEvaluate` by name; the `policy` sort arm is in both builds.
tradeoff = ["astrid-rules/tradeoff"]

# The rule groups of `astrid-rules` (docs/BROWSER_DOOR.md), OFF for the browser like the two above:
# it answers only what astrid-web's client-side code calls through core. Each forwards to the
# feature of the same name.
rules-repeating = ["astrid-rules/rules-repeating"]
rules-waiting = ["astrid-rules/rules-waiting"]
rules-decisions = ["astrid-rules/rules-decisions"]
rules-shell = ["astrid-rules/rules-shell"]
# Everything: the Node package (`scripts/build-wasm.sh`). astrid-web's server answers every rule
# through it, so it must keep every one the door has.
full = [
    "markdown",
    "orchestration",
    "tradeoff",
    "rules-repeating",
    "rules-waiting",
    "rules-decisions",
    "rules-shell",
]

[dependencies]
astrid-rules = { path = "../astrid-rules", version = "0.1.0", default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
