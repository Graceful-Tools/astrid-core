# The gate. The core has no platform dependency, and this is what keeps that true: the same
# format, lint and test run on Windows, macOS and Linux, so a dependency that only builds on one
# of them is caught the day it lands rather than the week a client tries to consume it.
#
# The fixtures are generated from astrid-web. Checking them against that repo's default branch is
# what turns a shared-behaviour change on the web into a failing build here instead of a
# divergence a user reports later. astrid-web is public, so the checkout needs no token.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain and its components come from rust-toolchain.toml, so there is one place
      # that decides which Rust this crate builds with.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  # astrid-rules is the half of the core the web loads as WebAssembly. It builds for
  # wasm32-unknown-unknown only while it stays pure — no clock, disk, socket or OS entropy — so a
  # dependency that reaches for one fails here, the day it lands, rather than in the web's build.
  wasm:
    name: astrid-rules (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Build
        run: cargo build -p astrid-rules --target wasm32-unknown-unknown

      # The binding astrid-web vendors (scripts/build-wasm.sh), in the profile it ships in.
      - name: Build the web binding
        run: cargo build -p astrid-rules-wasm --target wasm32-unknown-unknown --profile wasm

      - name: Clippy
        run: cargo clippy -p astrid-rules --target wasm32-unknown-unknown -- -D warnings

  contracts:
    name: cross-platform contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrid-core

      - uses: actions/checkout@v4
        with:
          repository: Graceful-Tools/astrid-web
          path: astrid-web

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astrid-web/package-lock.json

      # The markdown driver runs web's own renderer — `marked`, DOMPurify — in a jsdom window, so
      # it needs astrid-web's packages. Scripts are skipped: nothing here builds or generates.
      - name: Install astrid-web's packages
        working-directory: astrid-web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check fixtures against astrid-web
        working-directory: astrid-core
        run: node contracts/export-from-web.mjs --check --web ../astrid-web
