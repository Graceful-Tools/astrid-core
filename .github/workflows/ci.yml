# The gate. The core has no platform dependency, and this is what keeps that true: the same
# format, lint and test run on Windows, macOS and Linux, so a dependency that only builds on one
# of them is caught the day it lands rather than the week a client tries to consume it.
#
# The fixtures are generated from astrid-web. Checking them against that repo's default branch is
# what turns a shared-behaviour change on the web into a failing build here instead of a
# divergence a user reports later. astrid-web is public, so the checkout needs no token.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # An advisory is published between commits, so a push-only gate learns about it on whatever day
  # someone happens to touch the repo. astrid-web learned this on AWTD-914 and runs its npm audit
  # weekly for the same reason. Monday 06:00 UTC, before the Dependabot PRs land.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The supply chain ──────────────────────────────────────────────────────────────────────────
  # `cargo deny` over this workspace's own lockfile: advisories, licences, wildcard requirements and
  # where the crates came from. The rules are in `deny.toml` at the root, which says why each
  # licence in the allow list is there.
  #
  # Two invocations rather than one, because the two halves fail for unrelated reasons and a single
  # red job would not say which: `advisories` goes red when the WORLD changed (an advisory was
  # published against a version this repo already pinned), `licenses bans sources` when THIS REPO
  # changed (a new dependency arrived with a licence or from a place nobody has accepted). Both
  # block — a gate that cannot fail is documentation.
  supply-chain:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - licenses bans sources
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  core:
    name: core (${{ matrix.name }})
    # The weekly tick exists to ask the advisory database a question, not to rebuild the crate on
    # three operating systems. fmt, clippy and the tests answer to a commit, so they run when there
    # is one.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain and its components come from rust-toolchain.toml, so there is one place
      # that decides which Rust this crate builds with.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  # astrid-rules is the half of the core the web loads as WebAssembly. It builds for
  # wasm32-unknown-unknown only while it stays pure — no clock, disk, socket or OS entropy — so a
  # dependency that reaches for one fails here, the day it lands, rather than in the web's build.
  wasm:
    name: astrid-rules (wasm32)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Build
        run: cargo build -p astrid-rules --target wasm32-unknown-unknown

      # The binding astrid-web vendors (scripts/build-wasm.sh), in the profile it ships in.
      - name: Build the web binding
        run: cargo build -p astrid-rules-wasm --target wasm32-unknown-unknown --profile wasm

      - name: Clippy
        run: cargo clippy -p astrid-rules --target wasm32-unknown-unknown -- -D warnings

  # astrid-android builds this crate for Android through the NDK. A dependency that cannot target
  # it — the system OpenSSL that native-tls wants, for one — is caught here, the day it lands
  # (AATD-4).
  android:
    name: astrid-core (android, arm64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Packages named explicitly: the action's default list still includes the retired `tools`.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;27.2.12479018
      - name: cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a --platform 28 build -p astrid-core

  # `rust-toolchain.toml` said `channel = "stable"` while `Cargo.toml` declared
  # `rust-version = "1.82"`, the README called the toolchain "pinned", and no job checked either —
  # so the MSRV was a claim rather than a promise, and every machine built with whatever stable it
  # happened to have. Both files now name one version, and this job is what makes that checkable:
  # it fails if they disagree, and then builds the workspace under the declared MSRV.
  #
  # Lowering the MSRV below the pinned toolchain is allowed and is a deliberate act — install the
  # older toolchain, get `cargo check` green under it, and lower both files together. This job
  # keeps working when they differ in that direction, because it installs what `rust-version` says.
  msrv:
    name: MSRV
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The two files must name one version
        id: msrv
        run: |
          declared=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          pinned=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          echo "Cargo.toml rust-version: $declared"
          echo "rust-toolchain.toml channel: $pinned"
          if [ -z "$declared" ] || [ -z "$pinned" ]; then
            echo "::error::could not read rust-version from Cargo.toml or channel from rust-toolchain.toml"
            exit 1
          fi
          case "$pinned" in
            stable|beta|nightly*)
              echo "::error::rust-toolchain.toml is '$pinned'. Pin a version — a floating channel is what made the MSRV unverifiable."
              exit 1
              ;;
          esac
          if [ "$declared" != "$pinned" ]; then
            echo "::error::Cargo.toml says $declared and rust-toolchain.toml says $pinned. See CONSUMERS.md."
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      # Installed explicitly rather than taken from rust-toolchain.toml, so that this job still
      # checks the right compiler once the MSRV is deliberately lower than the pin.
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features --all-targets

  # Four repositories pin this core by revision, and nothing recorded what those revisions were
  # until CONSUMERS.md did. The November 2026 platform assessment read the Windows pin as 96
  # commits behind off a manifest that had already been bumped three times, which is what a table
  # nobody checks costs. `check-pins` asks whether every consumer is listed, whether each revision
  # is a real commit, and whether it is an ancestor of main — a pin at an unmerged branch means a
  # client is running code nobody reviewed. Being BEHIND main is only reported, never failed.
  #
  # Runs on the Monday schedule as well, unlike fmt/clippy/tests: a pin goes stale because time
  # passed in ANOTHER repository, so it has no commit here to answer to.
  pins:
    name: consumer pins
    runs-on: ubuntu-latest
    # A step's `if:` cannot read `secrets` — GitHub rejects the whole workflow file when it tries,
    # and then NO job runs, not only this one. A job's `env:` can read it, and a step's `if:` can
    # read `env`, so the presence of the token travels that way.
    env:
      HAS_PINS_TOKEN: ${{ secrets.CONSUMER_PINS_TOKEN != '' }}
    steps:
      # The whole history: `merge-base --is-ancestor` cannot be answered from a shallow clone, and
      # answering it wrong would fail every pin at once.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: astrid-core

      # Public, so this one needs no token.
      - uses: actions/checkout@v4
        with:
          repository: Graceful-Tools/astrid-web
          path: astrid-web

      # The other three are PRIVATE, and `secrets.GITHUB_TOKEN` is scoped to this repository
      # alone — so reading their manifests needs a token with read access to all three
      # (`CONSUMER_PINS_TOKEN`). Until 4c891314 the workflow had none, and those rows were checked
      # for shape and history while nothing compared them to the manifests they claim to describe:
      # all three could drift silently, which is the exact failure CONSUMERS.md was written to end.
      #
      # Each step is skipped when the secret is absent, and `check-pins` then reports those rows as
      # unchecked rather than failing — a fork's pull request gets no secrets at all, and a gate
      # that goes red for a reason the contributor cannot fix is worse than the gap it closed.
      - uses: actions/checkout@v4
        if: env.HAS_PINS_TOKEN == 'true'
        with:
          repository: Graceful-Tools/astrid-windows
          token: ${{ secrets.CONSUMER_PINS_TOKEN }}
          path: astrid-windows

      - uses: actions/checkout@v4
        if: env.HAS_PINS_TOKEN == 'true'
        with:
          repository: Graceful-Tools/astrid-ios
          token: ${{ secrets.CONSUMER_PINS_TOKEN }}
          path: astrid-ios

      - uses: actions/checkout@v4
        if: env.HAS_PINS_TOKEN == 'true'
        with:
          repository: Graceful-Tools/astrid-android
          token: ${{ secrets.CONSUMER_PINS_TOKEN }}
          path: astrid-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: astrid-core
          key: pins

      # All four paths, every run. A path that is not there is reported unchecked, so the same
      # command is right with the secret and without it — one invocation rather than two that can
      # disagree.
      - name: Check the pins table
        working-directory: astrid-core
        run: cargo xtask check-pins ../astrid-web ../astrid-windows ../astrid-ios ../astrid-android

      # The design tokens are pinned the same way: astrid-web vendors design/generated at the
      # revision in its packages/astrid-design/REVISION. Here because the comparison reads that
      # revision out of this repository's history, which only this job fetches whole. Before web
      # has vendored a copy the row is reported unchecked.
      - name: Check astrid-web's design tokens are ours
        working-directory: astrid-core
        run: cargo xtask check-design ../astrid-web

  contracts:
    name: cross-platform contracts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrid-core

      - uses: actions/checkout@v4
        with:
          repository: Graceful-Tools/astrid-web
          path: astrid-web

      # The fixtures are GENERATED IN astrid-web, by scripts/export-contract-fixtures.ts, and its
      # own predeploy fails if they are stale (check:contract-fixtures). So the only question left
      # here is whether our copies are still astrid-web's — a diff, not a regeneration (AWTD-1186).
      #
      # This job used to run a SECOND exporter living in this repo, which meant core was checked
      # against a retired generator: the two copies had drifted, and permissions.json alone
      # differed by 1800 lines. There is one exporter now, and it is web's.
      #
      # The comparison is `cargo xtask check-contracts` — the same one a developer runs — rather
      # than a `diff -ru` that reimplements it in shell. Two implementations of one check is how
      # the two exporters came to disagree, and the shell half carried exactly the bug f1c7b53f
      # fixed: it calls a CRLF checkout drift.
      - name: Check fixtures are astrid-web's
        working-directory: astrid-core
        run: cargo xtask check-contracts ../astrid-web
